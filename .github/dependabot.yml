version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      lint-and-format:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - 'typescript-eslint'
          - prettier
          - 'prettier-*'
      typescript:
        patterns:
          - typescript
          - '@types/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
          - jsdom
          - fake-indexeddb
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      typedoc:
        patterns:
          - typedoc
          - 'typedoc-*'
      # `@size-limit/*` peer-pins `size-limit` to an exact version, so split
      # PRs deadlock on ERESOLVE. They must always be bumped together.
      size-limit:
        patterns:
          - size-limit
          - '@size-limit/*'
      # `@playwright/test` pins an exact `playwright`, so a PR that bumps one
      # nests a second copy of the other, and the runner and the CLI disagree
      # about browser builds. They must always be bumped together.
      playwright:
        patterns:
          - playwright
          - '@playwright/test'
    ignore:
      # `@duckdb/duckdb-wasm` is a pre-release peer (`^1.33.1-dev42.0`).
      # Major bumps need to be reviewed manually against the worker bridge
      # (see review-plan.md §7 risk register).
      - dependency-name: '@duckdb/duckdb-wasm'
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the native ("tsgo") port: it drops `tsserver` and
      # `typescript-eslint` / `typedoc` peer-require `typescript <6.1.0`, so a
      # major bump breaks lint/typecheck/docs CI. Hold back until the toolchain
      # supports TS7; minor/patch bumps still flow through the typescript group.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
      # `size-limit` 13 requires Node `^22.18 || ^24 || >=26`. With
      # `engine-strict=true` in `.npmrc`, installing it would raise the
      # development floor from Node 22.13 (set by `@changesets/cli` 3; see
      # DEVELOPMENT.md) to 22.18. v13 adds no features we need (it only drops
      # Node 20, sheds two deps, and adds provenance). Hold back until that
      # floor is raised; minor/patch bumps still flow through the size-limit
      # group.
      - dependency-name: 'size-limit'
        update-types:
          - version-update:semver-major
      - dependency-name: '@size-limit/*'
        update-types:
          - version-update:semver-major
      # Same story as `size-limit` above: `jsdom` 30 requires Node
      # `^22.22.2 || ^24.15.0 || >=26`, so `engine-strict` would raise the
      # development floor from Node 22.13 to 22.22.2. jsdom only backs the
      # test DOM, so there is nothing to gain by forcing the runtime bump.
      # Hold back until that floor is raised; minor/patch still flow via the
      # vitest group.
      - dependency-name: 'jsdom'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
