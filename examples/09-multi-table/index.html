<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-table dashboard · Data Table examples</title>
    <!-- Light or dark as picked in the demo; the system's otherwise. -->
    <script>
      try {
        var theme = localStorage.getItem('dt-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.dtColorScheme = theme;
        }
      } catch (e) {
        /* storage unavailable */
      }
    </script>
    <link rel="stylesheet" href="../examples.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        min-height: 0;
        padding: 12px 16px 16px;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
      }
      .wrap h2 {
        margin: 0;
        color: var(--ex-muted);
        font-size: 12px;
        font-weight: 600;
      }
      #table-a,
      #table-b {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="ex-header">
      <a class="ex-back" href="../">← Examples</a>
      <h1><span class="ex-num">09</span> Multi-table</h1>
      <div class="ex-actions">
        <button id="save-a">Save preset from A</button>
        <button id="load-b">Load latest into B</button>
        <button id="clear">Clear both</button>
        <button id="clear-session">Clear session + reload</button>
      </div>
      <a
        class="ex-source"
        href="https://github.com/jeyabbalas/data-table/tree/main/examples/09-multi-table"
        rel="noopener"
        >Source ↗</a
      >
      <p class="ex-lede">
        Two tables on one <code>WorkerBridge</code>, sharing a <code>FilterPresetManager</code> and
        a <code>SessionStore</code>. Filter A, save its filters as a preset, then load the preset
        into B.
      </p>
    </header>
    <main>
      <div class="wrap">
        <h2>Table A</h2>
        <div id="table-a"></div>
      </div>
      <div class="wrap">
        <h2>Table B</h2>
        <div id="table-b"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
