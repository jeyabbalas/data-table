<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>09 — Multi-table dashboard</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
      header { padding: 0.75rem 1rem; border-bottom: 1px solid #ddd; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
      header h1 { margin: 0 0.75rem 0 0; font-size: 1rem; font-weight: 600; color: #333; }
      button { font: inherit; padding: 0.35rem 0.75rem; background: #f3f3f3; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
      button:hover { background: #e9e9e9; }
      main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.5rem; min-height: 0; }
      #table-a, #table-b { flex: 1; min-height: 0; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
      .label { position: absolute; margin: 0.25rem 0.5rem; font-size: 0.8rem; color: #666; background: rgba(255,255,255,0.8); padding: 0.1rem 0.35rem; border-radius: 3px; pointer-events: none; z-index: 1; }
      .wrap { position: relative; min-height: 0; display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <header>
      <h1>09 — Multi-table (<a href="../">back</a>)</h1>
      <button id="save-a">Save preset from A</button>
      <button id="load-b">Load latest into B</button>
      <button id="clear">Clear both</button>
      <button id="clear-session">Clear session + reload</button>
    </header>
    <main>
      <div class="wrap"><span class="label">A</span><div id="table-a"></div></div>
      <div class="wrap"><span class="label">B</span><div id="table-b"></div></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
