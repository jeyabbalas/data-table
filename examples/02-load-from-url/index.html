<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Load from URL</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
      }
      header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #ddd;
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: var(--dt-text);
      }
      #progress {
        flex: 1;
        height: 8px;
        background: #eee;
        border-radius: 4px;
        overflow: hidden;
      }
      #progress > span {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--dt-primary, #2563eb);
        transition: width 120ms ease;
      }
      #table {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Load from URL (<a href="../">back</a>)</h1>
      <div id="progress"><span></span></div>
    </header>
    <div id="table"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
