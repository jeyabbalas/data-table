version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      lint-and-format:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - 'typescript-eslint'
          - prettier
          - 'prettier-*'
      typescript:
        patterns:
          - typescript
          - '@types/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
          - jsdom
          - fake-indexeddb
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      typedoc:
        patterns:
          - typedoc
          - 'typedoc-*'
      # `@size-limit/*` peer-pins `size-limit` to an exact version, so split
      # PRs deadlock on ERESOLVE. They must always be bumped together.
      size-limit:
        patterns:
          - size-limit
          - '@size-limit/*'
      # `@playwright/test` pins an exact `playwright`, so a PR that bumps one
      # nests a second copy of the other, and the runner and the CLI disagree
      # about browser builds. They must always be bumped together.
      playwright:
        patterns:
          - playwright
          - '@playwright/test'
    ignore:
      # `@duckdb/duckdb-wasm` is a pre-release peer whose floor is the version
      # the library's worker is built with. Major bumps need to be reviewed
      # manually against the worker (`src/worker/`, where `openFileFix.ts`
      # patches duckdb-wasm's worker). In-range bumps change the shipped DuckDB
      # too: a lockfile-only bump like PR #56, which Dependabot classed as
      # semver-patch, moves the version the worker is built with, so the peer
      # floor and the exact version the docs tell self-hosters to pin must move
      # with it.
      - dependency-name: '@duckdb/duckdb-wasm'
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the native ("tsgo") port: it drops `tsserver` and
      # `typescript-eslint` / `typedoc` peer-require `typescript <6.1.0`, so a
      # major bump breaks lint/typecheck/docs CI. Hold back until the toolchain
      # supports TS7; minor/patch bumps still flow through the typescript group.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
