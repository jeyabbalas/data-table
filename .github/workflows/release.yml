name: Release

# Triggered on push to main. Two responsibilities, split across two
# steps:
#
#   1. The "Publish to npm (direct, with provenance)" step publishes any
#      version that's in `package.json` but not yet on the registry. It
#      uses the .npmrc that `actions/setup-node` already wired up against
#      `NPM_TOKEN`, which `npm whoami` validates in the diagnostic step
#      above it. This is the path that actually writes to npm.
#
#   2. The "Version PR (changesets/action)" step opens / updates the
#      "Version Packages" PR off any pending `.changeset/*.md` files.
#      `publish:` is intentionally NOT passed — its publish path failed
#      with E404-masks-403 against this token even when `npm whoami`
#      succeeded, which is why step (1) exists. Leaving the publish input
#      off means changesets/action only manages the version PR; no second
#      publish attempt, no spurious red.
#
# Manual prerequisites the maintainer enables before this workflow does
# anything dangerous on `main`:
#   - Add `NPM_TOKEN` repository secret with publish access to
#     `@jeyabbalas/data-table` (or enable npm OIDC trusted publishing on
#     the package settings page; in that case `NPM_TOKEN` is unused but
#     `id-token: write` is required).
#   - In the repo Settings → Actions → General, enable "Allow GitHub
#     Actions to create and approve pull requests" so changesets/action
#     can open the version PR.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets/action needs full history to detect changed packages.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Verify npm authentication
        run: |
          echo "registry: $(npm config get registry)"
          echo "always-auth: $(npm config get always-auth)"
          echo "whoami:"
          npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The actual publish step. Idempotent: if the current version is
      # already on the registry, it no-ops, so re-runs and unrelated
      # pushes to main don't republish or fail.
      - name: Publish to npm (direct, with provenance)
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          if npm view "@jeyabbalas/data-table@$PACKAGE_VERSION" version --silent >/dev/null 2>&1; then
            echo "@jeyabbalas/data-table@$PACKAGE_VERSION already on registry; skipping"
          else
            echo "Publishing @jeyabbalas/data-table@$PACKAGE_VERSION"
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Version-PR creation only. No `publish:` input — see the workflow
      # header comment for why.
      - name: Version PR (changesets/action)
        uses: changesets/action@v1
        with:
          version: npm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
