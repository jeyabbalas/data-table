<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programmatic filters · Data Table examples</title>
    <!-- Light or dark as picked in the demo; the system's otherwise. -->
    <script>
      try {
        var theme = localStorage.getItem('dt-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.dtColorScheme = theme;
        }
      } catch (e) {
        /* storage unavailable */
      }
    </script>
    <link rel="stylesheet" href="../examples.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #table {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="ex-header">
      <a class="ex-back" href="../">← Examples</a>
      <h1><span class="ex-num">03</span> Programmatic filters</h1>
      <div class="ex-actions">
        <button id="btn-card">Paid by card</button>
        <button id="btn-fare">Fare $10–$50</button>
        <button id="btn-tip">Tip &gt; 20%</button>
        <button id="btn-short">Trip &lt; 2 mi</button>
        <button id="btn-clear">Clear all</button>
      </div>
      <a
        class="ex-source"
        href="https://github.com/jeyabbalas/data-table/tree/main/examples/03-programmatic-filters"
        rel="noopener"
        >Source ↗</a
      >
      <p class="ex-lede">
        Each button adds a filter with <code>actions.addFilter</code> or
        <code>addRawSQLFilter</code>; the filters stack, and every change is logged from
        <code>filterChange</code> to the console.
      </p>
    </header>
    <div id="table"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
