<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>05 — Event listeners</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
      header { padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; }
      header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
      .split { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
      #table { min-height: 0; }
      aside { padding: 1rem; border-left: 1px solid #ddd; overflow: auto; font-size: 0.9em; background: #fafafa; display: flex; flex-direction: column; gap: 1rem; }
      aside section { background: #fff; border: 1px solid #e5e5e5; border-radius: 4px; padding: 0.75rem; }
      aside section h2 { font-size: 0.75em; margin: 0 0 0.5rem; color: #555; text-transform: uppercase; letter-spacing: 0.08em; }
      aside pre { margin: 0 0 0.5rem; font-size: 0.8em; white-space: pre-wrap; word-break: break-all; color: #333; }
      aside pre:last-child { margin-bottom: 0; }
      .drive button { display: block; width: 100%; text-align: left; padding: 0.4rem 0.6rem; margin: 0 0 0.4rem; background: #f3f3f3; border: 1px solid #ccc; border-radius: 3px; font: inherit; cursor: pointer; }
      .drive button:hover { background: #e9e9e9; }
      .drive button:last-child { margin-bottom: 0; }
    </style>
  </head>
  <body>
    <header><h1>05 — Event listeners (<a href="/">back</a>)</h1></header>
    <div class="split">
      <div id="table"></div>
      <aside>
        <section>
          <h2>Observe (via `on`)</h2>
          <div>filterChange</div><pre id="obs-filter">—</pre>
          <div>sortChange</div><pre id="obs-sort">—</pre>
          <div>selectionChange</div><pre id="obs-sel">—</pre>
        </section>
        <section class="drive">
          <h2>Drive (via `actions`)</h2>
          <button id="drv-sort">Sort by Fare ↓</button>
          <button id="drv-survived">Filter Survived = 1</button>
          <button id="drv-first10">Select first 10 rows</button>
          <button id="drv-clear">Clear everything</button>
        </section>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
