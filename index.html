<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Explore CSV, JSON, Parquet and Excel files in your browser with @jeyabbalas/data-table, an interactive data table built on DuckDB-WASM."
    />
    <title>Data Table</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 12.5h16M13.5 12.5V24M8 8h16v16H8z' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- The theme the page was left in, before the first paint. -->
    <script>
      try {
        var theme = localStorage.getItem('dt-demo-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {
        /* storage unavailable */
      }
    </script>
    <link rel="stylesheet" href="./demo/demo.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Data Table, home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" />
          <path d="M8 12.5h16M13.5 12.5V24M8 8h16v16H8z" />
        </svg>
        <span class="brand-name">Data Table</span>
      </a>
      <span class="version" title="@jeyabbalas/data-table version"
        >v<span id="version">…</span></span
      >
      <nav class="topnav" aria-label="Site">
        <a href="./examples/">Examples</a>
        <a href="./shortcuts/">Shortcuts</a>
        <a href="https://github.com/jeyabbalas/data-table" rel="noopener">GitHub</a>
      </nav>
      <fieldset class="theme-switch">
        <legend class="visually-hidden">Theme</legend>
        <label title="Light">
          <input type="radio" name="theme" value="light" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"
            />
          </svg>
          <span class="visually-hidden">Light</span>
        </label>
        <label title="Dark">
          <input type="radio" name="theme" value="dark" />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
          <span class="visually-hidden">Dark</span>
        </label>
        <label title="Match the system">
          <input type="radio" name="theme" value="auto" checked />
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12.5" rx="2" />
            <path d="M8.5 20h7M12 16.5V20" />
          </svg>
          <span class="visually-hidden">Auto</span>
        </label>
      </fieldset>
    </header>

    <section class="loadbar" aria-label="Load data">
      <input
        type="file"
        id="file-input"
        class="visually-hidden"
        tabindex="-1"
        aria-hidden="true"
        accept=".csv,.tsv,.txt,.json,.ndjson,.jsonl,.parquet,.pq,.xlsx,.xlsm,.xlsb,.xls,.ods"
      />
      <button type="button" id="open-file-btn" class="btn btn--primary">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5" />
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
        </svg>
        Open file
      </button>
      <form class="url-form" id="url-form" novalidate>
        <label class="url-field">
          <span class="visually-hidden">Dataset URL</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1" />
            <path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1" />
          </svg>
          <input
            type="text"
            id="url-input"
            inputmode="url"
            autocomplete="url"
            spellcheck="false"
            placeholder="Paste a link to a CSV, JSON, Parquet or Excel file"
          />
        </label>
        <button type="submit" id="load-url-btn" class="btn">Load</button>
      </form>
      <div class="examples" role="group" aria-labelledby="examples-label">
        <span class="examples-label" id="examples-label">Try</span>
        <button
          type="button"
          class="chip"
          data-url="https://raw.githubusercontent.com/jeyabbalas/data-table/refs/heads/main/tests/fixtures/datasets/csv/titanic.csv"
        >
          Titanic <span class="chip-format">CSV</span>
        </button>
        <button
          type="button"
          class="chip"
          data-url="https://raw.githubusercontent.com/jeyabbalas/data-table/refs/heads/main/tests/fixtures/datasets/json/palmer_penguins.json"
        >
          Palmer Penguins <span class="chip-format">JSON</span>
        </button>
        <button
          type="button"
          class="chip"
          data-url="https://raw.githubusercontent.com/jeyabbalas/data-table/main/tests/fixtures/datasets/parquet/nyc_taxi.parquet"
        >
          NYC Taxi <span class="chip-format">Parquet</span>
        </button>
        <button
          type="button"
          class="chip"
          data-url="https://raw.githubusercontent.com/jeyabbalas/data-table/main/tests/fixtures/datasets/parquet/nested-stress-tests.parquet"
          title="Lists, structs, maps and JSON. Press F2 or double-click a nested cell to inspect it."
        >
          Nested types <span class="chip-format">Parquet</span>
        </button>
        <button
          type="button"
          class="chip"
          data-url="https://raw.githubusercontent.com/jeyabbalas/data-table/main/tests/fixtures/datasets/xlsx/us_customer_orders_by_quarter.xlsx"
          title="A workbook with a sheet per quarter: pick the one to load."
        >
          Orders by quarter <span class="chip-format">Excel</span>
        </button>
      </div>
    </section>

    <main class="workspace">
      <div class="table-frame" id="table-frame">
        <div id="table-container" class="table-container">
          <div class="empty-state" id="empty-state">
            <svg class="empty-icon" viewBox="0 0 48 48" aria-hidden="true">
              <rect x="6" y="9" width="36" height="30" rx="5" />
              <path d="M6 18h36M18 18v21" />
              <path d="M30 24.5v9m0 0-3.5-3.5m3.5 3.5 3.5-3.5" />
            </svg>
            <p class="empty-title">Drop a file here to explore it</p>
            <p class="empty-text">
              CSV, JSON, Parquet or Excel. Everything runs in this page on DuckDB-WASM: your data
              never leaves your browser.
            </p>
            <p class="empty-error" id="empty-error" hidden></p>
          </div>
        </div>
        <div class="loading" id="loading" hidden>
          <div class="loading-card" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <div class="loading-text">
              <p class="loading-title" id="loading-title"></p>
              <p class="loading-detail" id="loading-detail"></p>
            </div>
            <div class="loading-bar" id="loading-bar" hidden><span></span></div>
            <button type="button" class="btn btn--quiet loading-skip" id="loading-skip" hidden>
              Skip
            </button>
          </div>
        </div>
        <div class="drop-target" id="drop-target" hidden aria-hidden="true">
          <p>Drop to load</p>
        </div>
      </div>
    </main>

    <footer class="statusbar">
      <div id="table-info" class="table-info"></div>
      <div class="actions" role="group" aria-label="Table actions">
        <button
          type="button"
          id="undo-btn"
          class="btn btn--ghost"
          disabled
          title="Undo (Ctrl/Cmd+Z)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
          </svg>
          Undo
        </button>
        <button
          type="button"
          id="redo-btn"
          class="btn btn--ghost"
          disabled
          title="Redo (Ctrl/Cmd+Shift+Z)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 14 5-5-5-5" />
            <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
          </svg>
          Redo
        </button>
        <button
          type="button"
          id="reset-btn"
          class="btn btn--ghost"
          disabled
          title="Undo every change since the data loaded"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5" />
            <path d="M3.5 3.5v5h5" />
          </svg>
          Reset
        </button>
        <span class="actions-divider" aria-hidden="true"></span>
        <button
          type="button"
          id="clear-session-btn"
          class="btn btn--ghost"
          disabled
          title="Forget this dataset and its saved state"
        >
          Clear session
        </button>
        <button type="button" id="export-btn" class="btn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5" />
            <path d="M4 17v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1" />
          </svg>
          Export
        </button>
      </div>
    </footer>

    <dialog class="dialog" id="sheet-dialog" aria-labelledby="sheet-dialog-title">
      <form method="dialog" class="dialog-form" id="sheet-form">
        <h2 class="dialog-title" id="sheet-dialog-title">Choose a sheet</h2>
        <p class="dialog-text" id="sheet-dialog-text"></p>
        <div
          class="sheet-list"
          id="sheet-list"
          role="radiogroup"
          aria-labelledby="sheet-dialog-title"
        ></div>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn" formnovalidate>Cancel</button>
          <button type="submit" value="load" class="btn btn--primary">Load sheet</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./demo/main.ts"></script>
  </body>
</html>
