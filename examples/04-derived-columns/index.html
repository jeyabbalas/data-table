<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derived columns · Data Table examples</title>
    <!-- Light or dark as picked in the demo; the system's otherwise. -->
    <script>
      try {
        var theme = localStorage.getItem('dt-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.dtColorScheme = theme;
        }
      } catch (e) {
        /* storage unavailable */
      }
    </script>
    <link rel="stylesheet" href="../examples.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .split {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        min-height: 0;
      }
      #table {
        min-height: 0;
      }
      aside button.danger {
        border-color: var(--dt-error-border-soft);
        background: var(--dt-error-bg);
        color: var(--dt-error-text-strong);
      }
      aside button.danger:hover {
        background: color-mix(in srgb, var(--dt-error-bg) 80%, var(--dt-error) 20%);
      }
      #event-log {
        min-height: 4em;
      }
    </style>
  </head>
  <body>
    <header class="ex-header">
      <a class="ex-back" href="../">← Examples</a>
      <h1><span class="ex-num">04</span> Derived columns</h1>
      <a
        class="ex-source"
        href="https://github.com/jeyabbalas/data-table/tree/main/examples/04-derived-columns"
        rel="noopener"
        >Source ↗</a
      >
    </header>
    <div class="split">
      <div id="table"></div>
      <aside>
        <section>
          <h2>Add</h2>
          <p>Create derived columns from the loaded data.</p>
          <button id="btn-expr">Add expression: <code>tip_pct</code></button>
          <button id="btn-vec">Add vector: <code>is_airport</code></button>
          <button id="btn-dep">Add dependent: <code>tip_pct_flag = tip_pct &gt; 10</code></button>
        </section>

        <section>
          <h2>Replace <code>tip_pct</code></h2>
          <p>
            Same-name replacement via <code>replaceDerivedColumn</code>, which pre-flights
            dependents.
          </p>
          <button id="btn-replace-compat">
            Compatible: <code>100 * tip_amount / NULLIF(fare_amount, 0) + 0.0001</code>
          </button>
          <button id="btn-replace-incompat" class="danger">
            Incompatible: <code>CAST(tip_amount AS VARCHAR)</code> — breaks
            <code>tip_pct_flag</code>
          </button>
        </section>

        <section>
          <h2>Event log (<code>derivedChange</code>)</h2>
          <pre id="event-log">(no events yet)</pre>
        </section>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
