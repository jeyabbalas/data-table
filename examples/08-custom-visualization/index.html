<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom visualization · Data Table examples</title>
    <!-- Light or dark as picked in the demo; the system's otherwise. -->
    <script>
      try {
        var theme = localStorage.getItem('dt-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.dtColorScheme = theme;
        }
      } catch (e) {
        /* storage unavailable */
      }
    </script>
    <link rel="stylesheet" href="../examples.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #table {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="ex-header">
      <a class="ex-back" href="../">← Examples</a>
      <h1><span class="ex-num">08</span> Custom visualization</h1>
      <a
        class="ex-source"
        href="https://github.com/jeyabbalas/data-table/tree/main/examples/08-custom-visualization"
        rel="noopener"
        >Source ↗</a
      >
      <p class="ex-lede">
        A US-states choropleth replaces the default <code>ValueCounts</code> on the
        <code>state</code> column — each state shaded by row-count frequency. Rendered with
        Observable Plot; topology from <code>us-atlas</code>. Hover a state for its name and count.
      </p>
    </header>
    <div id="table"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
