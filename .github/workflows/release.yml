name: Release

# Triggered on push to main. Two responsibilities, split across two
# steps:
#
#   1. The "Publish to npm" step publishes any version that's in
#      `package.json` but not yet on the registry. Authentication uses npm
#      OIDC trusted publishing: the job mints a short-lived OIDC token
#      (via `id-token: write`) that npm verifies against the trusted
#      publisher configured for this package. There is no long-lived
#      `NPM_TOKEN` — nothing to leak or rotate. npm also generates a
#      provenance attestation automatically under trusted publishing.
#      This is the path that actually writes to npm. A prerelease version
#      publishes under its own dist-tag (`next`), never `latest`.
#
#   2. The "Version PR (changesets/action)" step opens / updates the
#      "Version Packages" PR off any pending `.changeset/*.md` files.
#      `publish-script:` is intentionally NOT passed — publishing is
#      handled by step (1), so changesets/action only manages the version
#      PR; no second publish attempt, no spurious red. Without it, the
#      action's tag and GitHub-release options never run either.
#
# Manual prerequisites the maintainer enables before this workflow does
# anything dangerous on `main`:
#   - Configure a trusted publisher for `@jeyabbalas/data-table` on
#     npmjs.com (package Settings → Trusted Publisher → GitHub Actions):
#     org/user `jeyabbalas`, repo `data-table`, workflow file
#     `release.yml`, no environment. This is what authorizes OIDC publish;
#     `id-token: write` below is the matching half.
#   - In the repo Settings → Actions → General, enable "Allow GitHub
#     Actions to create and approve pull requests" so changesets/action
#     can open the version PR.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changesets/action needs full history to detect changed packages.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing requires Node >= 22.14.0, but `npm ci` below
          # needs >= 22.22.2 under `.npmrc`'s engine-strict (jsdom 30; see
          # DEVELOPMENT.md), so don't pin an older 22.x here. `check-latest`
          # takes the newest Node 22, not the runner image's cached one.
          node-version: '22'
          check-latest: true
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 ships npm 10.x; trusted publishing (OIDC) requires
      # npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      # The actual publish step. Authenticates via OIDC trusted publishing
      # (no NODE_AUTH_TOKEN). Idempotent: if the current version is already
      # on the registry, it no-ops, so re-runs and unrelated pushes to main
      # don't republish or fail.
      #
      # A prerelease (`0.9.0-next.0`) publishes under its identifier as the
      # dist-tag (`next`), so `npm install` keeps resolving to the last
      # stable version. npm 11 refuses a prerelease without `--tag`.
      - name: Publish to npm (OIDC trusted publishing, with provenance)
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          case "$PACKAGE_VERSION" in
            *-*)
              DIST_TAG="${PACKAGE_VERSION#*-}"
              DIST_TAG="${DIST_TAG%%.*}"
              ;;
            *) DIST_TAG=latest ;;
          esac
          if npm view "@jeyabbalas/data-table@$PACKAGE_VERSION" version --silent >/dev/null 2>&1; then
            echo "@jeyabbalas/data-table@$PACKAGE_VERSION already on registry; skipping"
          else
            echo "Publishing @jeyabbalas/data-table@$PACKAGE_VERSION with tag $DIST_TAG"
            npm publish --access public --provenance --tag "$DIST_TAG"
          fi

      # Version-PR creation only. No `publish-script:` input — see the
      # workflow header comment for why. v2 is the release line for
      # @changesets/cli 3; `github-token` defaults to the workflow token.
      - name: Version PR (changesets/action)
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
