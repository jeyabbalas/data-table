<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derived columns</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        background: var(--dt-bg);
        color: var(--dt-text);
      }
      header {
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--dt-border);
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: var(--dt-text);
      }
      header a {
        color: var(--dt-primary);
      }
      .split {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        min-height: 0;
      }
      #table {
        min-height: 0;
      }
      aside {
        padding: 1rem;
        border-left: 1px solid var(--dt-border);
        overflow: auto;
        font-size: 0.9em;
        background: var(--dt-bg-secondary);
        color: var(--dt-text);
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      aside section {
        background: var(--dt-bg);
        border: 1px solid var(--dt-border);
        border-radius: 4px;
        padding: 0.75rem;
      }
      aside section h2 {
        font-size: 0.75em;
        margin: 0 0 0.5rem;
        color: var(--dt-text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      aside p {
        margin: 0 0 0.5rem;
      }
      aside code {
        background: var(--dt-bg-tertiary);
        padding: 0 0.2rem;
        border-radius: 3px;
        font-size: 0.95em;
      }
      aside button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.4rem 0.6rem;
        margin: 0 0 0.4rem;
        background: var(--dt-bg-tertiary);
        color: var(--dt-text);
        border: 1px solid var(--dt-border);
        border-radius: 3px;
        font: inherit;
        cursor: pointer;
      }
      aside button:hover {
        background: color-mix(in srgb, var(--dt-bg-tertiary) 70%, var(--dt-text) 12%);
      }
      aside button:last-child {
        margin-bottom: 0;
      }
      aside button.danger {
        background: var(--dt-error-bg);
        border-color: var(--dt-error-border-soft);
        color: var(--dt-error-text-strong);
      }
      aside button.danger:hover {
        background: color-mix(in srgb, var(--dt-error-bg) 80%, var(--dt-error) 20%);
      }
      #event-log {
        margin: 0;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.85em;
        white-space: pre-wrap;
        color: var(--dt-text);
        background: var(--dt-bg-secondary);
        padding: 0.5rem;
        border-radius: 3px;
        border: 1px solid var(--dt-border);
        word-break: break-word;
        min-height: 4em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Derived columns (<a href="../">back</a>)</h1>
    </header>
    <div class="split">
      <div id="table"></div>
      <aside>
        <section>
          <h2>Add</h2>
          <p>Create derived columns from the loaded data.</p>
          <button id="btn-expr">Add expression: <code>tip_pct</code></button>
          <button id="btn-vec">Add vector: <code>is_airport</code></button>
          <button id="btn-dep">Add dependent: <code>tip_pct_flag = tip_pct &gt; 10</code></button>
        </section>

        <section>
          <h2>Replace <code>tip_pct</code></h2>
          <p>
            Same-name replacement via <code>replaceDerivedColumn</code>, which pre-flights
            dependents.
          </p>
          <button id="btn-replace-compat">
            Compatible: <code>100 * tip_amount / NULLIF(fare_amount, 0) + 0.0001</code>
          </button>
          <button id="btn-replace-incompat" class="danger">
            Incompatible: <code>CAST(tip_amount AS VARCHAR)</code> — breaks
            <code>tip_pct_flag</code>
          </button>
        </section>

        <section>
          <h2>Event log (<code>derivedChange</code>)</h2>
          <pre id="event-log">(no events yet)</pre>
        </section>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
