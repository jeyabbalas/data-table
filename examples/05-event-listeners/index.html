<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event listeners · Data Table examples</title>
    <!-- Light or dark as picked in the demo; the system's otherwise. -->
    <script>
      try {
        var theme = localStorage.getItem('dt-demo-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.dtColorScheme = theme;
        }
      } catch (e) {
        /* storage unavailable */
      }
    </script>
    <link rel="stylesheet" href="../examples.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .split {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        min-height: 0;
      }
      #table {
        min-height: 0;
      }
      .event-name {
        margin: 10px 0 4px;
        font-family: var(--ex-mono);
        font-size: 12px;
        font-weight: 600;
      }
      .event-name:first-of-type {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <header class="ex-header">
      <a class="ex-back" href="../">← Examples</a>
      <h1><span class="ex-num">05</span> Event listeners</h1>
      <a
        class="ex-source"
        href="https://github.com/jeyabbalas/data-table/tree/main/examples/05-event-listeners"
        rel="noopener"
        >Source ↗</a
      >
    </header>
    <div class="split">
      <div id="table"></div>
      <aside>
        <section>
          <h2>Observe (via <code>on</code>)</h2>
          <div class="event-name">filterChange</div>
          <pre id="obs-filter">—</pre>
          <div class="event-name">sortChange</div>
          <pre id="obs-sort">—</pre>
          <div class="event-name">selectionChange</div>
          <pre id="obs-sel">—</pre>
        </section>
        <section class="drive">
          <h2>Drive (via <code>actions</code>)</h2>
          <button id="drv-sort">Sort by Fare ↓</button>
          <button id="drv-survived">Filter Survived = 1</button>
          <button id="drv-first10">Select first 10 rows</button>
          <button id="drv-clear">Clear everything</button>
        </section>
      </aside>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
